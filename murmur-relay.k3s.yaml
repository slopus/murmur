apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: murmur-relay-data
    namespace: default
    labels:
        app.kubernetes.io/name: murmur-relay
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 10Gi
    storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: murmur-relay
    namespace: default
    labels:
        app.kubernetes.io/name: murmur-relay
        app.kubernetes.io/version: 0.2.0
spec:
    replicas: 1
    revisionHistoryLimit: 2
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app.kubernetes.io/name: murmur-relay
    template:
        metadata:
            labels:
                app.kubernetes.io/name: murmur-relay
                app.kubernetes.io/version: 0.2.0
        spec:
            automountServiceAccountToken: false
            enableServiceLinks: false
            terminationGracePeriodSeconds: 30
            securityContext:
                fsGroup: 65532
                fsGroupChangePolicy: OnRootMismatch
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: relay
                  image: ghcr.io/slopus/murmur-relay:0.2.0
                  imagePullPolicy: IfNotPresent
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                      readOnlyRootFilesystem: true
                  ports:
                      - name: http
                        containerPort: 8787
                        protocol: TCP
                  env:
                      - name: HOST
                        value: 0.0.0.0
                      - name: PORT
                        value: "8787"
                      - name: MURMUR_RELAY_STORE
                        value: sqlite
                      - name: MURMUR_RELAY_DB
                        value: /data/murmur-relay.sqlite
                  startupProbe:
                      httpGet:
                          path: /health
                          port: http
                      failureThreshold: 30
                      periodSeconds: 2
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: http
                      failureThreshold: 3
                      periodSeconds: 5
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: http
                      failureThreshold: 3
                      periodSeconds: 10
                  resources:
                      requests:
                          cpu: 50m
                          memory: 128Mi
                      limits:
                          cpu: "1"
                          memory: 512Mi
                  volumeMounts:
                      - name: data
                        mountPath: /data
                      - name: temporary
                        mountPath: /tmp
            volumes:
                - name: data
                  persistentVolumeClaim:
                      claimName: murmur-relay-data
                - name: temporary
                  emptyDir:
                      sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
    name: murmur-relay
    namespace: default
    labels:
        app.kubernetes.io/name: murmur-relay
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: murmur-relay
    ports:
        - name: http
          port: 8787
          targetPort: http
          protocol: TCP
          appProtocol: http
